## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ============================================================================
# JVM: one warm, long-lived daemon. ParallelGC = highest build throughput,
# and the free-ratio flags force the heap to SHRINK back to the OS after
# big phases (like R8) finish, so an idle daemon doesn't squat on RAM.
# ============================================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -Dfile.encoding=UTF-8

# Warm Kotlin compiler daemon: JIT-warmed and reused between builds, which
# makes incremental compiles significantly faster than in-process restarts.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseParallelGC

# Use the full JDK (has jlink/javac) instead of VS Code's JRE-based toolchain
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.10.7-hotspot

android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false

# ============================================================================
# Performance: parallel multi-module builds across all 8 cores / 16 threads,
# bounded to 12 workers to leave air for Windows + VS Code.
# ============================================================================
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.workers.max=12

# Daemon self-terminates after 30 idle minutes - fast when you're building
# repeatedly, gone (RAM freed) when you walk away.
org.gradle.daemon.idletimeout=1800000

# Incremental Kotlin compilation
kotlin.incremental=true

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Reuse task outputs across builds. This is the task output cache and is
# unrelated to dependency resolution, so it does not affect SNAPSHOT
# dependency downloads (those are governed by the timeouts set above).
org.gradle.caching=true
